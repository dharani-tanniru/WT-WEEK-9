<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arrays</title>
</head>
<body>
    <script>
        let arr=[10,20,30,40,50];
        let sum=0;
        let mul=1;
        for (let i=0;i<arr.length;i++)
    {
        sum=sum+arr[i];
        mul=mul*arr[i];
    }
    document.write("sum="+sum,"<br>");
    document.write("mul="+mul);
    </script>
</body>
</html>
