<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>largest element</title>
</head>
<body>
    <script>
        let arr=[10,46,71,56,35];
        let largest=arr[0];
        for(let i=1;i<arr.length;i++)
    {
        if(arr[i]>largest){
            largest=arr[i];
        }
    }
    document.write("largest="+largest);
    </script>
</body>
</html>
